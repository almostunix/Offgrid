# XcodeGen project for the Cerbo app (T-19). Generate with `xcodegen generate`; the .xcodeproj is not committed.
name: CerboApp
options:
  bundleIdPrefix: com.almostunix
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  VictronKit:
    path: .            # this repo's Swift package (Package.swift); the app links its VictronKit library
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CerboApp:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["README.md"]
    dependencies:
      - package: VictronKit
        product: VictronKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.almostunix.cerbo
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Cerbo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "Cerbo connects to your Victron Cerbo GX on your local network to show live data."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
